name: heart_health_score
description: "Heart Health Score Calculator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking (wired up when backend integration starts)
  dio: ^5.5.0+1

  # Local persistence (auth token / onboarding draft cache)
  shared_preferences: ^2.2.3

  # Value equality for models (repositories, state classes)
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  health: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/


  fonts:
     - family: MuseoModerno
       fonts:
         - asset: assets/fonts/MuseoModerno-Regular.ttf
         - asset: assets/fonts/MuseoModerno-Medium.ttf
           weight: 500
         - asset: assets/fonts/MuseoModerno-Bold.ttf
           weight: 700
     - family: Manrope
       fonts:
         - asset: assets/fonts/Manrope-Regular.ttf
         - asset: assets/fonts/Manrope-Medium.ttf
           weight: 500
         - asset: assets/fonts/Manrope-SemiBold.ttf
           weight: 600
         - asset: assets/fonts/Manrope-Bold.ttf
           weight: 700
         - asset: assets/fonts/Manrope-ExtraBold.ttf
           weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"   # or your brand color
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: false
